<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CMS - Reset Password</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .reset-card {
            width: 100%;
            background-color: white;
            padding: 58px 58px 48px;
            text-align: center;
        }

        .reset-card h2 {
            margin: 0 0 10px;
            color: #1f3c88;
            font-size: 28px;
        }

        .reset-card .instruction {
            margin-bottom: 28px;
        }

        .reset-card form {
            display: flex;
            flex-direction: column;
            gap: 14px;
            text-align: left;
        }

        .reset-card label {
            color: #1f2f3d;
            font-weight: 600;
            font-size: 14px;
        }

        .reset-card input {
            width: 100%;
            padding: 14px 15px;
            border: 1px solid #d6e0ef;
            border-radius: 10px;
            font-size: 15px;
            margin-top: 6px;
        }

        .reset-card button {
            width: 100%;
            margin-top: 12px;
            padding: 14px 18px;
            border: none;
            border-radius: 10px;
            background: linear-gradient(135deg, #17336f 0%, #24529a 58%, #087ab8 100%);
            color: white;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
        }

        .reset-card button:disabled {
            opacity: 0.7;
            cursor: wait;
        }

        .reset-message {
            min-height: 22px;
            margin: 16px 0 0;
            font-size: 14px;
            font-weight: 600;
            color: #b42318;
        }

        .reset-message.success {
            color: #027a48;
        }

        .back-link {
            display: inline-block;
            margin-top: 18px;
            color: #24529a;
            text-decoration: none;
            font-weight: 600;
        }

        @media (max-width: 860px) {
            .login-container {
                padding: 16px;
            }

            .public-shell {
                grid-template-columns: 1fr;
            }

            .welcome-panel {
                min-height: auto;
                padding: 32px 24px 26px;
            }

            .reset-card {
                padding: 30px 20px 26px;
            }
        }
    </style>
</head>

<body>
    <main class="login-container">
        <div class="public-shell">
            <section class="welcome-panel">
                <div class="welcome-branding">
                    <img src="./logo.png" alt="GBU Rukara Logo" class="cms-logo">
                    <p class="welcome-eyebrow">GBU Rukara</p>
                    <h1>Reset Your Password</h1>
                </div>

                <div class="welcome-copy">
                    <p class="welcome-kicker">Secure access for the CMS</p>
                    <h2>Set a new password to continue.</h2>
                    <p>
                        Use the secure link sent to your email to create a fresh password for your account.
                    </p>
                </div>

                <div class="welcome-footer">
                    <span>GBU Rukara</span>
                    <span>Cell leadership workspace</span>
                </div>
            </section>

            <section class="reset-card">
                <h2>New Password</h2>
                <p class="instruction">Choose a strong password for your CMS account.</p>

                <form id="reset-password-form" novalidate>
                    <div>
                        <label for="new-password">New Password</label>
                        <input type="password" id="new-password" placeholder="Enter a new password" autocomplete="new-password" required>
                    </div>

                    <div>
                        <label for="confirm-password">Confirm Password</label>
                        <input type="password" id="confirm-password" placeholder="Repeat your new password" autocomplete="new-password" required>
                    </div>

                    <label class="password-toggle">
                        <input type="checkbox" class="password-toggle-input" data-password-target="new-password">
                        Show password
                    </label>

                    <label class="password-toggle">
                        <input type="checkbox" class="password-toggle-input" data-password-target="confirm-password">
                        Show confirm password
                    </label>

                    <button type="submit" id="reset-submit">UPDATE PASSWORD</button>
                </form>

                <p id="reset-message" class="reset-message" aria-live="polite"></p>

                <a href="index.html" class="back-link">Back to login</a>
            </section>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase.js"></script>
    <script src="reset-password.js"></script>
</body>

</html>
