<!-- =========================================
     ADD / EDIT MEMBER MODAL
     ========================================= -->

<div
    class="modal-overlay"
    id="memberModal"
>


    <div
        class="modal"
        role="dialog"
        aria-modal="true"
        aria-labelledby="memberModalTitle"
    >


        <div class="modal-header">


            <h2 id="memberModalTitle">
                Add Member
            </h2>


            <button
                type="button"
                class="close-button"
                id="closeMemberModal"
                aria-label="Close"
            >

                ×

            </button>


        </div>



        <form id="memberForm">


            <input
                type="hidden"
                id="memberId"
            >



            <!-- FULL NAME -->

            <label for="memberName">
                Full Name *
            </label>


            <input
                type="text"
                id="memberName"
                placeholder="Enter member's full name"
                required
            >



            <!-- PHONE -->

            <label for="memberPhone">
                Phone Number
            </label>


            <input
                type="tel"
                id="memberPhone"
                placeholder="Enter phone number"
            >



            <!-- GENDER -->

            <label for="memberGender">
                Gender
            </label>


            <select id="memberGender">

                <option value="">
                    Select gender
                </option>

                <option value="Male">
                    Male
                </option>

                <option value="Female">
                    Female
                </option>

            </select>



            <!-- YEAR -->

            <label for="memberYear">
                Year of Study *
            </label>


            <select
                id="memberYear"
                required
            >

                <option value="">
                    Select year
                </option>

                <option value="Year 1">
                    Year 1
                </option>

                <option value="Year 2">
                    Year 2
                </option>

                <option value="Year 3">
                    Year 3
                </option>

                <option value="Year 4">
                    Year 4
                </option>

                <option value="Other">
                    Other
                </option>

            </select>



            <!-- COMBINATION -->

            <label for="memberCombination">
                Combination
            </label>


            <input
                type="text"
                id="memberCombination"
                placeholder="e.g. MEE, MCE, MPE, BCE, PCE, SNE"
            >



            <!-- CELL -->

            <label for="memberCell">
                Cell *
            </label>


            <select
                id="memberCell"
                required
            >

                <option value="">
                    Select a cell
                </option>

            </select>



            <!-- DATE JOINED -->

            <label for="memberDateJoined">
                Date Joined
            </label>


            <input
                type="date"
                id="memberDateJoined"
            >



            <!-- STATUS -->

            <label for="memberStatus">
                Status *
            </label>


            <select
                id="memberStatus"
                required
            >

                <option value="Active">
                    Active
                </option>

                <option value="Inactive">
                    Inactive
                </option>

                <option value="Moved to another cell">
                    Moved to another cell
                </option>

            </select>



            <!-- NOTES -->

            <label for="memberNotes">
                Notes
            </label>


            <textarea
                id="memberNotes"
                rows="3"
                placeholder="Additional information..."
            ></textarea>



            <!-- BUTTONS -->

            <div class="modal-actions">


                <button
                    type="button"
                    class="cancel-button"
                    id="cancelMemberButton"
                >

                    Cancel

                </button>


                <button
                    type="submit"
                    class="primary-button"
                >

                    Save Member

                </button>


            </div>


        </form>


    </div>

</div>

     ===================================================== -->

<script>
const logoutButton =
    document.getElementById("logoutBtn");

if (logoutButton) {

    logoutButton.addEventListener(
        "click",
        async function () {

            try {

                if (window.supabaseClient) {

                    await window.supabaseClient
                        .auth
                        .signOut();

                }

                window.location.href =
                    "index.html";

            }
            catch (error) {

                console.error(
                    "Logout error:",
                    error
                );

                window.location.href =
                    "index.html";

            }

        }
    );

}
</script>
