    <main class="main-content">


        <section class="dashboard-section leaders-page">


            <!-- PAGE HEADER -->

            <div class="page-header">


                <div class="page-title">

                    <h1>
                        Cell Leaders
                    </h1>

                    <p>
                        All GBU Rukara cell leaders.
                    </p>

                </div>


                <button
                    type="button"
                    class="primary-button"
                    id="addLeaderButton"
                >

                    + Add Cell Leader

                </button>


            </div>



            <!-- SEARCH -->

            <div class="search-container">

                <input
                    type="text"
                    id="leaderSearch"
                    placeholder="Search cell leaders..."
                    autocomplete="off"
                >

                        >

                        </tbody>


                    </table>

                </div>


            </div>

<!-- =====================================================
     ADD / EDIT LEADER MODAL
===================================================== -->

<div
    class="leader-modal-overlay"
    id="leaderModal"
>


    <div
        class="leader-modal"
        role="dialog"
        aria-modal="true"
        aria-labelledby="leaderModalTitle"
    >


        <!-- MODAL HEADER -->

        <div class="leader-modal-header">


            <h2 id="leaderModalTitle">
                Add Cell Leader
            </h2>


            <button
                type="button"
                class="leader-close-button"
                id="closeLeaderModal"
                aria-label="Close"
            >

                ×

            </button>


        </div>



        <!-- FORM -->

        <form id="leaderForm">


            <input
                type="hidden"
                id="leaderId"
            >


            <!-- NAME -->

            <div class="form-group">

                <label for="leaderName">

                    Leader Name
                    <span class="required">*</span>

                </label>


                <input
                    type="text"
                    id="leaderName"
                    placeholder="Enter leader name"
                    autocomplete="name"
                    required
                >

            </div>



            <!-- EMAIL -->

            <div class="form-group">

                <label for="leaderEmail">

                    Email Address

                </label>


                <input
                    type="email"
                    id="leaderEmail"
                    placeholder="Enter email address"
                    autocomplete="email"
                >

            </div>



            <!-- PHONE -->

            <div class="form-group">

                <label for="leaderPhone">

                    Phone Number

                </label>


                <input
                    type="tel"
                    id="leaderPhone"
                    placeholder="Enter phone number"
                    autocomplete="tel"
                >

            </div>



            <!-- CELL -->

            <div class="form-group">

                <label for="leaderCell">

                    Assign Cell
                    <span class="required">*</span>

                </label>


                <select
                    id="leaderCell"
                    required
                >

                    <option value="">
                        Select a cell
                    </option>

                </select>

            </div>



            <!-- ACTIONS -->

            <div class="leader-modal-actions">


                <button
                    type="button"
                    class="cancel-button"
                    id="cancelLeaderButton"
                >

                    Cancel

                </button>


                <button
                    type="submit"
                    class="primary-button save-leader-button"
                >

                    Save Leader

                </button>


            </div>


        </form>


    </div>

</div>
